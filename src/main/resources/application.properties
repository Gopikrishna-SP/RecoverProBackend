server.port=8080

# -------------------------------
# DATASOURCE (Railway PUBLIC URL)
# -------------------------------
spring.datasource.url=jdbc:postgresql://mainline.proxy.rlwy.net:53170/railway
spring.datasource.username=postgres
spring.datasource.password=EjdkmIubkcffYwjNBBqJhFJZkzdojyJj
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# PostgreSQL connection settings
spring.datasource.hikari.auto-commit=true

# -------------------------------
# JPA / HIBERNATE (CRITICAL FIXES)
# -------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# HIBERNATE EXPLICIT DIALECT (FIXES: Unable to determine Dialect without JDBC metadata)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JDBC and timezone settings
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Hibernate optimizations
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

# Connection pool validation
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# Additional PostgreSQL-specific settings
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# HibernateException handling
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

